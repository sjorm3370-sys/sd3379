<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 보드 · 할 일 관리</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif;color:#202a3b;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #818cf8;outline-offset:3px}header{background:white;border-bottom:1px solid #e4e7ee;padding:26px max(24px,calc((100vw - 1260px)/2))}header small{color:#555f74;font-size:12px;letter-spacing:2px}h1{font-size:28px;margin:10px 0}header p{color:#596579;margin:0;font-size:14px}main{max-width:1308px;margin:auto;padding:28px 24px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:26px}.search{flex:1;min-width:200px}input,textarea,select{border:1px solid #cdd3df;border-radius:9px;background:white;padding:11px;color:#202a3b;width:100%}textarea{resize:vertical;min-height:100px}.btn{padding:10px 15px;border:1px solid #cdd3df;border-radius:9px;background:white;color:#344056}.primary{background:#4f46e5;border-color:#4f46e5;color:white}.danger{color:#b42335}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.column{background:#ebedf3;border:1px solid #e1e4ed;border-radius:15px;padding:16px;min-height:480px}.column.over{outline:2px dashed #4f46e5;background:#e7e5ff}.col-head{display:flex;align-items:center;gap:9px;margin:0 0 18px;font-size:15px}.dot{width:9px;height:9px;border-radius:50%;background:#7c879b}.doing .dot{background:#7860ee}.done .dot{background:#1d9874}.count{font-size:12px;color:#526075;background:white;padding:3px 7px;border-radius:6px}.cards{min-height:50px}.card{background:white;border:1px solid #dce1eb;border-radius:11px;padding:17px;margin-bottom:12px;box-shadow:0 3px 8px #24304b05;cursor:grab}.card h3{font-size:15px;line-height:1.5;margin:11px 0 6px;overflow-wrap:anywhere}.card p{font-size:13px;color:#5b667a;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin:0 0 15px}.badge{display:inline-block;font-size:11px;border-radius:5px;padding:4px 7px;background:#edf1f7;color:#526075}.badge.high{background:#fff0ed;color:#ad3824}.badge.mid{background:#fff6df;color:#805600}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#596579}.edit{border:0;background:none;color:#4f46e5;padding:6px}.add-col{width:100%;text-align:left;border:1px dashed #c7cdda;border-radius:9px;background:transparent;padding:11px;color:#566179}.empty{text-align:center;font-size:13px;color:#626d80;padding:32px 8px}.bottom{font-size:12px;line-height:1.7;color:#616c80;margin-top:22px}.progress{height:5px;background:#e1e4ee;border-radius:6px;margin:18px 0 8px;overflow:hidden}.progress span{display:block;background:#4f46e5;height:100%;transition:width .2s}dialog{border:0;border-radius:16px;padding:26px;width:min(480px,calc(100% - 32px));box-shadow:0 24px 80px #10182840}dialog::backdrop{background:#14213d66}dialog h2{margin:0 0 20px;font-size:21px}label{display:block;margin:14px 0 6px;font-size:13px;font-weight:600}.row{display:flex;gap:14px}.row>div{flex:1;min-width:0}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:24px}.actions .danger{margin-right:auto}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#202a3b;color:white;border-radius:10px;max-width:90%;z-index:5}#notice:empty{display:none}@media(max-width:760px){.board{grid-template-columns:1fr}.column{min-height:190px}header{padding:24px}main{padding:22px 16px}.toolbar .btn{font-size:13px}.search{flex-basis:100%}}
.quick-priority{width:auto;max-width:100%;padding:5px 8px;font-size:12px;cursor:pointer}.card-controls{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.quick-done{font-size:12px;padding:7px 10px;background:#ecfdf3;color:#176344;border:1px solid #a5d9ba;border-radius:7px}.done .card h3{color:#647086;text-decoration:line-through}.done .quick-done{background:#f3f4f8;color:#47546a;border-color:#cdd3df}</style></head><body><header><small>MY PERSONAL WORKSPACE</small><h1>오늘의 보드<span style="color:#4f46e5">.</span></h1><p>해야 할 일을 정리하고, 하나씩 가볍게 끝내세요.</p></header><main><div class="toolbar"><input class="search" id="search" type="search" placeholder="제목이나 내용으로 검색" aria-label="할 일 검색"><button class="btn" id="export">백업 내보내기</button><button class="btn" id="import">백업 가져오기</button><button class="btn primary" id="new">＋ 새 할 일</button><input id="file" type="file" accept="application/json,.json" hidden></div><div id="board" class="board"></div><div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="bottom"><span id="summary"></span><br>카드에서 우선순위를 바로 선택하고 ‘완료 처리’를 누르세요. 완료 취소 시 ‘할 일’로 돌아갑니다. 열 사이 드래그 이동도 가능합니다.<br>현재 브라우저에 자동 저장됩니다. 브라우저 데이터 삭제에 대비해 정기적으로 백업하세요.</div></main><dialog id="dialog"><form id="form"><h2 id="formTitle">새 할 일</h2><label for="title">제목 *</label><input id="title" maxlength="160" required placeholder="무엇을 해야 하나요?"><label for="description">내용</label><textarea id="description" maxlength="5000" placeholder="메모나 체크할 내용을 적어두세요."></textarea><div class="row"><div><label for="status">상태</label><select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div><div><label for="priority">우선순위</label><select id="priority"><option value="low">낮음</option><option value="mid" selected>보통</option><option value="high">높음</option></select></div></div><label for="due">마감일</label><input type="date" id="due"><div class="actions"><button type="button" class="btn danger" id="delete">삭제</button><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn primary">저장</button></div></form></dialog><div id="notice" role="status"></div><script>
'use strict';
const $=id=>document.getElementById(id), KEY='personal-kanban-v1', states={todo:'할 일',doing:'진행 중',done:'완료'}, priorities={low:'낮음',mid:'보통',high:'높음'};
let tasks=[],editing=null,dragged=null,timer;
function notify(text){$('notice').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('notice').textContent='',4500)}
function valid(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&t.title.trim().length>0&&t.title.length<=160&&typeof t.description==='string'&&t.description.length<=5000&&Object.hasOwn(states,t.status)&&Object.hasOwn(priorities,t.priority)&&typeof t.due==='string'&&(t.due===''||(/^\d{4}-\d{2}-\d{2}$/.test(t.due)&&!Number.isNaN(Date.parse(t.due))))}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(valid)||new Set(parsed.map(t=>t.id)).size!==parsed.length)throw Error();tasks=parsed}}catch(e){notify('기존 데이터를 읽지 못했습니다. 저장 전 백업을 확인하세요.')}
function commit(next){try{localStorage.setItem(KEY,JSON.stringify(next));tasks=next;render();return true}catch(e){notify('저장하지 못했습니다. 브라우저 저장 공간과 권한을 확인하세요.');return false}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(){const board=$('board');board.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase();for(const [status,name]of Object.entries(states)){const col=el('section','column '+status);col.setAttribute('aria-label',name);const list=tasks.filter(t=>t.status===status&&(!q||(t.title+' '+t.description).toLocaleLowerCase().includes(q)));const heading=el('h2','col-head');heading.append(el('span','dot'),document.createTextNode(name),el('span','count',String(list.length)));col.append(heading);const cards=el('div','cards');for(const t of list){const card=el('article','card');card.draggable=true;card.addEventListener('dragstart',e=>{dragged=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move'});card.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});const prioritySelect=el('select','quick-priority badge '+t.priority);prioritySelect.setAttribute('aria-label',t.title+' 우선순위');for(const [value,label]of Object.entries(priorities)){const option=el('option','','우선순위: '+label);option.value=value;prioritySelect.append(option)}prioritySelect.value=t.priority;prioritySelect.onchange=()=>{if(commit(tasks.map(x=>x.id===t.id?{...x,priority:prioritySelect.value}:x)))notify('우선순위를 변경했습니다.')};card.append(prioritySelect,el('h3','',t.title));if(t.description)card.append(el('p','',t.description));const foot=el('div','foot');foot.append(el('span','',t.due?'마감 '+t.due:'마감일 없음'));const edit=el('button','edit','수정');edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openTask(t.id);foot.append(edit);card.append(foot);const controls=el('div','card-controls');const complete=el('button','quick-done',t.status==='done'?'↶ 완료 취소':'✓ 완료 처리');complete.setAttribute('aria-label',t.title+(t.status==='done'?' 완료 취소':' 완료 처리'));complete.onclick=()=>{const nextStatus=t.status==='done'?'todo':'done';if(commit(tasks.map(x=>x.id===t.id?{...x,status:nextStatus}:x)))notify(nextStatus==='done'?'완료했습니다!':'할 일로 되돌렸습니다.')};controls.append(complete);card.append(controls);cards.append(card)}if(!list.length)cards.append(el('p','empty',q?'검색 결과가 없습니다.':'아직 카드가 없습니다.'));col.append(cards);const add=el('button','add-col','＋ 할 일 추가');add.onclick=()=>openTask(null,status);col.append(add);col.addEventListener('dragover',e=>{e.preventDefault();if(dragged)col.classList.add('over')});col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(dragged)commit(tasks.map(t=>t.id===dragged?{...t,status}:t));dragged=null});board.append(col)}const done=tasks.filter(t=>t.status==='done').length;$('summary').textContent=`전체 ${tasks.length}개 · 완료 ${done}개 · 완료율 ${tasks.length?Math.round(done/tasks.length*100):0}%`;$('bar').style.width=(tasks.length?done/tasks.length*100:0)+'%'}
function openTask(id=null,status='todo'){editing=id;const t=tasks.find(t=>t.id===id);$('form').reset();$('formTitle').textContent=t?'할 일 수정':'새 할 일';$('title').value=t?.title||'';$('description').value=t?.description||'';$('status').value=t?.status||status;$('priority').value=t?.priority||'mid';$('due').value=t?.due||'';$('delete').hidden=!t;$('dialog').showModal();$('title').focus()}
$('new').onclick=()=>openTask();$('cancel').onclick=()=>$('dialog').close();$('search').oninput=render;
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('제목을 입력하세요.');$('title').reportValidity();return}const t={id:editing||('task-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),title,description:$('description').value.trim(),status:$('status').value,priority:$('priority').value,due:$('due').value};if(commit(editing?tasks.map(x=>x.id===editing?t:x):[...tasks,t])){$('dialog').close();notify('저장했습니다.')}};$('title').oninput=()=>$('title').setCustomValidity('');
$('delete').onclick=()=>{if(editing&&confirm('이 할 일을 삭제할까요?')){if(commit(tasks.filter(t=>t.id!==editing)))$('dialog').close()}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kanban-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.tasks)||!data.tasks.every(valid)||new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length)throw Error();if(confirm(`현재 보드를 백업의 ${data.tasks.length}개 카드로 교체할까요? 현재 데이터가 대체됩니다.`)){const clean=data.tasks.map(({id,title,description,status,priority,due})=>({id,title,description,status,priority,due}));if(commit(clean))notify('백업을 가져왔습니다.')}}catch(err){notify('지원하는 백업 파일이 아닙니다. 올바른 JSON 백업을 선택하세요.')}finally{e.target.value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY)notify('다른 탭에서 보드가 변경되었습니다. 이 탭에서 편집하기 전에 새로고침하세요.')});render();
</script></body></html>
