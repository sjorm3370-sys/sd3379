<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 보드 · 할 일 관리</title><link rel="stylesheet" href="styles.css"></head><body><header><small>MY PERSONAL WORKSPACE</small><h1>오늘의 보드<span class="accent">.</span></h1><p>해야 할 일을 정리하고, 하나씩 가볍게 끝내세요.</p></header><main><section id="auth" class="auth-panel"><h2>내 보드 로그인</h2><p>로그인한 계정의 카드만 Supabase에서 불러옵니다.</p><form id="auth-form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호 (최소 8자)</label><input id="password" type="password" minlength="8" autocomplete="current-password" required><div class="actions"><button class="btn" type="button" id="signup">회원가입</button><button class="btn primary" type="submit">로그인</button></div></form></section><div id="workspace" hidden><div class="account"><span id="account"></span><button id="refresh" class="btn">새로고침</button><button id="logout" class="btn">로그아웃</button></div><div class="toolbar"><input class="search" id="search" type="search" placeholder="제목이나 내용으로 검색" aria-label="할 일 검색"><button class="btn" id="export">백업 내보내기</button><button class="btn" id="import">백업 가져오기</button><button class="btn primary" id="new">＋ 새 할 일</button><input id="file" type="file" accept="application/json,.json" hidden></div><div id="board" class="board"></div><div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="bottom"><span id="summary"></span><br>카드에서 우선순위를 바로 선택하고 ‘완료 처리’를 누르세요. 완료 취소 시 ‘할 일’로 돌아갑니다. 열 사이 드래그 이동도 가능합니다.<br>카드 변경사항은 Supabase에 저장됩니다. 다른 기기의 변경사항은 새로고침으로 불러오세요.</div></div></main><dialog id="dialog"><form id="form"><h2 id="formTitle">새 할 일</h2><label for="title">제목 *</label><input id="title" maxlength="160" required placeholder="무엇을 해야 하나요?"><label for="description">내용</label><textarea id="description" maxlength="5000" placeholder="메모나 체크할 내용을 적어두세요."></textarea><div class="row"><div><label for="status">상태</label><select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></div><div><label for="priority">우선순위</label><select id="priority"><option value="low">낮음</option><option value="mid" selected>보통</option><option value="high">높음</option></select></div></div><label for="due">마감일</label><input type="date" id="due"><div class="actions"><button type="button" class="btn danger" id="delete">삭제</button><button type="button" class="btn" id="cancel">취소</button><button type="submit" class="btn primary">저장</button></div></form></dialog><div id="notice" role="status"></div><script src="config.js"></script><script src="app.js" defer></script></body></html>
